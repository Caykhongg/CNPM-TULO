<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickOrder</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body>
<div class="wrap"><h1>Giỏ hàng</h1><p class="sub" id="from"></p><div id="box"></div></div>
<script>
QO.header('customer');
(async () => {
  const box = document.getElementById('box');
  const draw = async () => { const c = QO.getCart(), shop = c.shop_id && await QO.get('shops', c.shop_id);
    document.getElementById('from').textContent = shop ? 'Quán: ' + shop.name : '';
    if (!c.items.length) { box.innerHTML = '<div class="empty"><b>Giỏ hàng trống</b><a class="btn" href="home.html">Chọn món</a></div>'; return; }
    const line = i => (i.price + i.options.reduce((s, o) => s + o.extra_price, 0)) * i.qty, total = c.items.reduce((s, i) => s + line(i), 0);
    box.innerHTML = '<div class="list">' + c.items.map(i => '<div class="item"><div><h3>' + QO.esc(i.name) + '</h3><div class="meta">' + (i.options.map(o => QO.esc(o.name)).join(', ') || 'Không tùy chọn') + '</div></div><div class="acts"><button class="btn ghost sm" data-d="' + i.key + '" data-n="-1">−</button><b>' + i.qty + '</b><button class="btn ghost sm" data-d="' + i.key + '" data-n="1">+</button><span class="price" style="min-width:90px;text-align:right">' + QO.money(line(i)) + '</span></div></div>').join('') + '</div><div class="card row" style="margin-top:16px"><b>Tổng cộng</b><span class="price" style="font-size:20px">' + QO.money(total) + '</span></div>';
  };
  box.onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; const c = QO.getCart(), i = c.items.find(x => x.key === b.dataset.d); i.qty += Number(b.dataset.n); c.items = c.items.filter(x => x.qty > 0); QO.setCart(c); draw(); };
  draw();
})();
</script></body></html>
