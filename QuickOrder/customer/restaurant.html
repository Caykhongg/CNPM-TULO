<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thực đơn - QuickOrder</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body>
<div class="wrap" id="root"></div>
<dialog id="dlg"><form method="dialog" id="f"><h2 id="dn"></h2><div id="gs"></div><div class="err" id="er"></div><div class="row" style="margin-top:12px"><button class="btn ghost" value="x">Hủy</button><button class="btn" id="ok" value="ok">Thêm vào giỏ</button></div></form></dialog>
<script>
QO.header('customer');
(async () => {
  const root = document.getElementById('root'), id = QO.param('id'), table = QO.param('table');
  const shop = id && await QO.get('shops', id);
  if (!shop || shop.status !== 'APPROVED') { root.innerHTML = '<div class="empty"><b>Không tìm thấy quán</b><a class="btn" href="home.html">Về trang chủ</a></div>'; return; }

  const [dAll, cats, gAll, oAll] = await Promise.all([QO.by('dishes', 'shop_id', id), QO.all('categories'), QO.all('optionGroups'), QO.all('options')]);
  const dishes = dAll.filter(d => !d.is_deleted);
  const groupsOf = d => gAll.filter(g => g.dish_id === d.id);
  const optsOf = g => oAll.filter(o => o.group_id === g.id);
  const accepting = QO.isAccepting(shop);
  let q = QO.param('q') || '', cat = 0, cur = null;

  const [label, tone] = accepting ? ['Đang nhận đơn', 'ok'] : ['Hiện không nhận đơn', 'no'];
  root.innerHTML = `
    <a class="meta" href="home.html">← Các quán khác</a>
    <section class="card shop-head" style="margin-top:8px">
      <div class="row">
        <div><h1>${QO.esc(shop.name)}</h1><p class="sub" style="margin-bottom:0">${QO.esc(shop.address)}</p></div>
        <span class="tag ${tone}">${label}</span>
      </div>
      <div class="meta" style="margin-top:8px">Giờ mở cửa ${QO.esc(shop.open_time)} – ${QO.esc(shop.close_time)} · ${QO.esc(shop.phone)}</div>
      ${table ? '<div class="meta" style="margin-top:6px">Bạn đang gọi món cho bàn đã quét QR.</div>' : ''}
    </section>
    <div class="search" style="border:1px solid var(--line);max-width:none;margin-top:18px"><input id="q" type="search" placeholder="Tìm món trong quán..." value="${QO.esc(q)}" aria-label="Tìm món trong quán"></div>
    <div class="chips" id="chips"></div>
    <div id="menu"></div>`;

  const menuEl = document.getElementById('menu'), chipsEl = document.getElementById('chips');

  const card = d => {
    const ok = QO.isOrderable(d), gs = groupsOf(d);
    const hint = gs.length ? gs.map(g => QO.esc(g.name)).join(', ') : 'Không có tùy chọn';
    return `<div class="item${ok ? '' : ' off'}">
      <div><h3>${QO.esc(d.name)}</h3><div class="meta">${hint}</div></div>
      <div class="acts"><span class="price">${QO.money(d.price)}</span>${ok ? `<button class="btn sm" data-add="${d.id}"${accepting ? '' : ' disabled'}>Thêm</button>` : '<span class="tag no">Hết món</span>'}</div>
    </div>`;
  };

  const draw = () => {
    const k = QO.norm(q), shown = dishes.filter(d => (!cat || d.category_id === cat) && (!k || QO.norm(d.name).includes(k)));
    const used = cats.filter(c => dishes.some(d => d.category_id === c.id));
    const sections = used.filter(c => shown.some(d => d.category_id === c.id))
      .map(c => `<h2 style="margin-top:22px">${QO.esc(c.name)}</h2><div class="list">${shown.filter(d => d.category_id === c.id).map(card).join('')}</div>`).join('');
    menuEl.innerHTML = dishes.length ? (sections || '<div class="empty"><b>Không có món phù hợp</b></div>') : '<div class="empty"><b>Quán chưa có món</b>Menu sẽ hiển thị khi quán thêm món.</div>';
    chipsEl.innerHTML = used.length
      ? `<button class="chip${cat ? '' : ' on'}" data-c="0">Tất cả</button>` + used.map(c => `<button class="chip${cat === c.id ? ' on' : ''}" data-c="${c.id}">${QO.esc(c.name)}</button>`).join('')
      : '';
  };

  document.getElementById('q').oninput = e => { q = e.target.value; draw(); };
  chipsEl.onclick = e => { const b = e.target.closest('[data-c]'); if (b) { cat = Number(b.dataset.c); draw(); } };

  const dlg = document.getElementById('dlg'), dn = document.getElementById('dn'), er = document.getElementById('er'), gsEl = document.getElementById('gs');
  const push = (d, picked) => {
    const c = QO.getCart();
    if (c.shop_id && c.shop_id !== shop.id) { if (!confirm('Giỏ đang có món của quán khác. Xóa giỏ cũ?')) return; c.items = []; }
    c.shop_id = shop.id; c.table = table || c.table;
    const key = d.id + ':' + picked.map(o => o.id).sort().join(',');
    const ex = c.items.find(i => i.key === key);
    if (ex) ex.qty++;
    else c.items.push({key, dish_id: d.id, name: d.name, price: d.price, options: picked.map(o => ({id: o.id, name: o.name, extra_price: o.extra_price})), qty: 1});
    QO.setCart(c); QO.toast('Đã thêm ' + d.name);
  };

  menuEl.onclick = e => {
    const b = e.target.closest('[data-add]'); if (!b) return;
    cur = dishes.find(d => d.id === Number(b.dataset.add));
    const gs = groupsOf(cur);
    if (!gs.length) return push(cur, []);
    dn.textContent = cur.name; er.textContent = '';
    gsEl.innerHTML = gs.map(g => `<fieldset class="grp" style="border:0"><legend>${QO.esc(g.name)} <span class="meta">(${g.is_required ? 'bắt buộc' : 'tùy chọn'}, chọn ${g.is_multiple ? 'nhiều' : '1'})</span></legend>${optsOf(g).map(o => `<label><span><input type="${g.is_multiple ? 'checkbox' : 'radio'}" name="g${g.id}" value="${o.id}" style="width:auto;margin-right:8px">${QO.esc(o.name)}</span><span class="meta">${o.extra_price ? '+' + QO.money(o.extra_price) : ''}</span></label>`).join('')}</fieldset>`).join('');
    dlg.showModal();
  };

  document.getElementById('ok').onclick = e => {
    const gs = groupsOf(cur), picked = [];
    for (const g of gs) {
      const sel = optsOf(g).filter(o => dlg.querySelector(`[name="g${g.id}"][value="${o.id}"]`).checked);
      if (!QO.validateSelection(g, sel)) { e.preventDefault(); er.textContent = `Vui lòng chọn đúng cho nhóm "${g.name}".`; return; }
      picked.push(...sel);
    }
    push(cur, picked);
  };

  draw();
})();
</script></body></html>
