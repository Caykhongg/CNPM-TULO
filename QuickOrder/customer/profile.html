<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ - QuickOrder</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body>
<div class="wrap" style="max-width:640px">
  <h1>Hồ sơ</h1>
  <p class="sub">Thông tin tài khoản và địa chỉ giao hàng.</p>
  <div class="shell" style="margin-bottom:16px">
    <b>Chưa có đăng nhập khách hàng</b><br>Đăng ký và đăng nhập cho khách đang được phát triển. Hiện chỉ chủ quán đăng ký được tài khoản.
  </div>
  <form class="card" onsubmit="return false">
    <label class="field"><span>Họ tên</span><input name="name" disabled></label>
    <label class="field"><span>Số điện thoại</span><input name="phone" type="tel" disabled></label>
    <label class="field"><span>Email</span><input name="email" type="email" disabled></label>
    <label class="field"><span>Địa chỉ giao hàng</span><input name="address" disabled></label>
    <button class="btn" type="button" disabled>Lưu thay đổi</button>
  </form>
</div>
<script>QO.header('customer');</script>
</body></html>
