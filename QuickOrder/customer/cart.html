<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giỏ hàng - QuickOrder</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/customer-checkout.css"><script src="../js/app.js"></script></head><body>
<main class="wrap checkout-page">
  <a class="meta" id="back" href="home.html">← Tiếp tục chọn món</a>
  <h1 style="margin-top:8px">Giỏ hàng</h1>
  <p class="sub" id="from"></p>
  <div class="cart-grid">
    <section id="box" aria-label="Món trong giỏ"><p class="sub">Đang tải giỏ hàng…</p></section>
    <aside class="card" id="checkout" aria-label="Đặt món" hidden>
      <div>
        <h2>Thông tin nhận món</h2>
        <p class="meta" id="where"></p>
        <label class="field"><span>Tên người gọi (không bắt buộc)</span><input name="name" autocomplete="name" maxlength="60" placeholder="Tên của bạn"></label>
        <label class="field"><span>Ghi chú (không bắt buộc)</span><textarea name="note" rows="2" maxlength="300" placeholder="Ví dụ: ít đá, không hành"></textarea></label>
      </div>
      <div>
        <h2 id="pay-title">Chọn cách thanh toán</h2>
        <div class="payment-choices" id="pays" role="group" aria-labelledby="pay-title"></div>
        <p class="meta checkout-note" id="pay"></p>
      </div>
      <details>
        <summary>Có mã giảm giá?</summary>
        <div class="row checkout-note"><input id="cp" maxlength="20" placeholder="Nhập mã" aria-label="Mã giảm giá" autocomplete="off" style="text-transform:uppercase;flex:1;min-width:0"><button class="btn ghost sm" type="button" id="cpok">Áp dụng</button></div>
        <div class="meta checkout-note" id="cpmsg" role="status"></div>
      </details>
      <div>
        <div id="sum"></div>
        <div class="err checkout-note" id="err" role="alert"></div>
        <button class="btn" type="button" id="order" disabled>Gửi đơn</button>
        <p class="meta checkout-note" id="history-note"></p>
      </div>
    </aside>
  </div>
</main>
<dialog id="edlg"><form method="dialog"><h2 id="edn"></h2><div id="egs"></div><div class="err" id="eer"></div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" value="x">Hủy</button><button class="btn" id="eok" value="ok">Lưu</button></div></form></dialog>
<script>
QO.header('customer');
(async () => {
  const box = document.getElementById('box'), sum = document.getElementById('sum'), from = document.getElementById('from');
  const checkout = document.getElementById('checkout'), paysEl = document.getElementById('pays'), payEl = document.getElementById('pay');
  const whereEl = document.getElementById('where'), errEl = document.getElementById('err'), orderBtn = document.getElementById('order');
  const nameEl = document.querySelector('input[name="name"]'), noteEl = document.querySelector('textarea[name="note"]');
  const PAYS = [['CASH', 'Tiền mặt', 'Trả tiền tại quán'], ['TRANSFER', 'Quét QR chuyển khoản', 'Trả trước qua ứng dụng ngân hàng']];
  let shop = null, tb = null, method = 'CASH', sending = false, requestId = '';
  let coupon = '', quote = null;                    // mã đang áp dụng và kết quả tính thử của server (giảm giá do server tính)
  const cpEl = document.getElementById('cp'), cpMsg = document.getElementById('cpmsg'), cpBtn = document.getElementById('cpok');
  let groups = [], opts = [], editing = null;       // nhóm và tùy chọn của các món trong giỏ, để sửa tùy chọn
  const groupsOf = id => groups.filter(g => g.dish_id === id && opts.some(o => o.group_id === g.id)), optsOf = g => opts.filter(o => o.group_id === g.id);

  // Giá một phần = giá món + tùy chọn (khớp với giá server tính)
  const line = i => (i.price + i.options.reduce((s, o) => s + o.extra_price, 0)) * i.qty;

  const renderPay = () => {
    payEl.textContent = method === 'TRANSFER' ? 'Đơn gửi đến quán sau khi khoản chuyển được xác nhận.' : 'Đơn gửi đến quán ngay khi bạn bấm Gửi đơn.';
  };

  const renderSum = (total, count) => {
    const d = quote ? quote.discount : 0;
    sum.innerHTML = `<div class="kv"><span>Số món</span><b>${count}</b></div>` + (d ? `
      <div class="kv"><span>Tạm tính</span><span>${QO.money(total)}</span></div>
      <div class="kv"><span>Giảm giá (${QO.esc(quote.coupon_code)})</span><b style="color:var(--ok,#15803d)">−${QO.money(d)}</b></div>` : '') + `
      <div class="row" style="margin-top:12px"><b>Tổng cộng</b><span class="price" style="font-size:20px">${QO.money(total - d)}</span></div>`;
  };

  let quoting = false;
  const updateOrderButton = () => {
    const accepting = !!shop && QO.isAccepting(shop);
    orderBtn.disabled = sending || quoting || !tb || !accepting;
    if (!tb) orderBtn.textContent = 'Cần quét mã QR của bàn';
    else if (!accepting) orderBtn.textContent = 'Quán tạm ngưng nhận món';
    else if (sending || quoting) orderBtn.textContent = sending ? 'Đang xử lý…' : 'Đang kiểm tra mã giảm giá…';
    else orderBtn.textContent = method === 'TRANSFER' ? 'Hiện mã QR thanh toán' : 'Gửi đơn · Trả tiền mặt';
  };

  // Hỏi server giảm bao nhiêu cho giỏ hiện tại; giỏ đổi thì tính lại, mã hết hợp lệ thì bỏ mã và báo lý do
  let qSeq = 0;
  const requote = async (c = QO.getCart(), say = false) => {
    const seq = ++qSeq;
    if (!coupon || !c.items.length) { quote = null; quoting = false; updateOrderButton(); return; }
    quoting = true;
    updateOrderButton();
    try {
      const r = await QO.api('POST', 'orders/quote', {shop_id: c.shop_id, coupon_code: coupon,
        items: c.items.map(i => ({dish_id: i.dish_id, quantity: i.qty, option_ids: i.options.map(o => o.id)}))});
      if (seq !== qSeq) return;
      quote = r; cpMsg.textContent = 'Đã áp dụng mã ' + r.coupon_code + ': giảm ' + QO.money(r.discount) + '.';
    } catch (e) {
      if (seq !== qSeq) return;
      quote = null; coupon = ''; cpMsg.textContent = e.message;
    }
    quoting = false;
    renderSum(c.items.reduce((s, i) => s + line(i), 0), c.items.reduce((s, i) => s + i.qty, 0));
    updateOrderButton();
  };
  cpBtn.onclick = () => {
    if (sending) return;
    coupon = cpEl.value.trim().toUpperCase(); quote = null;
    if (!coupon) { cpMsg.textContent = ''; draw(); return; }
    cpMsg.textContent = 'Đang kiểm tra...'; requote();
  };
  cpEl.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); cpBtn.click(); } };

  const draw = () => {
    const c = QO.getCart();
    const back = c.shop_id ? 'restaurant.html?id=' + c.shop_id + (c.table ? '&table=' + encodeURIComponent(c.table) : '') : 'home.html';
    document.getElementById('back').href = back;
    from.textContent = shop ? 'Quán: ' + shop.name : '';

    if (!c.items.length) {
      qSeq++;
      quoting = false;
      quote = null;
      box.innerHTML = `<div class="empty"><b>Giỏ hàng trống</b><a class="btn" href="${back}">Chọn món</a></div>`;
      checkout.hidden = true;
      return;
    }
    checkout.hidden = false;

    const total = c.items.reduce((s, i) => s + line(i), 0), count = c.items.reduce((s, i) => s + i.qty, 0);
    box.innerHTML = '<div class="list">' + c.items.map(i => `
      <div class="item">
        <div><h3>${QO.esc(i.name)}</h3><div class="meta">${QO.esc(i.options.map(o => o.name).join(', ') || 'Không tùy chọn')}</div></div>
        <div class="acts">
          <button class="btn ghost sm" data-d="${QO.esc(i.key)}" data-n="-1" aria-label="Giảm số lượng">−</button>
          <b>${i.qty}</b>
          <button class="btn ghost sm" data-d="${QO.esc(i.key)}" data-n="1" aria-label="Tăng số lượng">+</button>
          <span class="price" style="min-width:90px;text-align:right">${QO.money(line(i))}</span>
          ${groupsOf(i.dish_id).length ? `<button class="btn ghost sm" data-e="${QO.esc(i.key)}" aria-label="Sửa tùy chọn ${QO.esc(i.name)}">Sửa</button>` : ''}
          <button class="btn bad sm" data-x="${QO.esc(i.key)}" aria-label="Xóa ${QO.esc(i.name)} khỏi giỏ">Xóa</button>
        </div>
      </div>`).join('') + '</div><div style="margin-top:12px"><button class="btn ghost sm" type="button" id="clear">Xóa toàn bộ giỏ</button></div>';

    renderSum(total, count);
    if (!sending) requote(c);

    whereEl.innerHTML = tb ? `Tại bàn: <b>${QO.esc(QO.tableLabel(tb.table_number))}</b>` : 'Chưa xác định bàn. Hãy dùng camera điện thoại quét lại mã QR trên bàn.';
    const payButtons = paysEl.querySelectorAll?.('[data-pay]');
    if (!payButtons?.length) {
      paysEl.innerHTML = PAYS.map(([v, title, description]) => `<button type="button" data-pay="${v}" aria-pressed="${method === v}"><strong>${title}</strong><span class="meta">${description}</span></button>`).join('');
    } else {
      payButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pay === method)));
    }
    renderPay();

    updateOrderButton();
  };

  box.onclick = e => {
    if (sending) return;
    if (e.target.closest('#clear')) {
      if (!confirm('Xóa toàn bộ món trong giỏ?')) return;
      const c = QO.getCart(); c.items = []; QO.setCart(c); draw(); return;
    }
    const ed = e.target.closest('[data-e]');
    if (ed) {
      editing = QO.getCart().items.find(x => x.key === ed.dataset.e); if (!editing) return;
      const have = new Set(editing.options.map(o => o.id));
      document.getElementById('edn').textContent = editing.name; document.getElementById('eer').textContent = '';
      document.getElementById('egs').innerHTML = groupsOf(editing.dish_id).map(g => `<fieldset class="grp" style="border:0"><legend>${QO.esc(g.name)} <span class="meta">(${g.is_required ? 'bắt buộc' : 'tùy chọn'}, chọn ${g.is_multiple ? 'nhiều' : '1'})</span></legend>${optsOf(g).map(o => `<label><input type="${g.is_multiple ? 'checkbox' : 'radio'}" name="g${g.id}" value="${o.id}"${have.has(o.id) ? ' checked' : ''}> ${QO.esc(o.name)}${o.extra_price ? ` <span class="meta">(+${QO.money(o.extra_price)})</span>` : ''}</label>`).join('')}</fieldset>`).join('');
      document.getElementById('edlg').showModal(); return;
    }
    const rm = e.target.closest('[data-x]');
    if (rm) { const c = QO.getCart(); c.items = c.items.filter(x => x.key !== rm.dataset.x); QO.setCart(c); draw(); return; }
    const b = e.target.closest('[data-d]'); if (!b) return;
    const c = QO.getCart(), i = c.items.find(x => x.key === b.dataset.d);
    if (!i) return;
    i.qty += Number(b.dataset.n);
    c.items = c.items.filter(x => x.qty > 0);
    QO.setCart(c); draw();
  };
  document.getElementById('eok').onclick = e => {
    const d = document.getElementById('edlg'), picked = [];
    for (const g of groupsOf(editing.dish_id)) {
      const sel = optsOf(g).filter(o => d.querySelector(`[name="g${g.id}"][value="${o.id}"]`).checked);
      if (!QO.validateSelection(g, sel)) { e.preventDefault(); document.getElementById('eer').textContent = `Vui lòng chọn đúng cho nhóm "${g.name}".`; return; }
      picked.push(...sel);
    }
    const c = QO.getCart(), cur = c.items.find(x => x.key === editing.key); if (!cur) return;
    cur.options = picked.map(o => ({id: o.id, name: o.name, extra_price: o.extra_price}));
    cur.key = cur.dish_id + ':' + picked.map(o => o.id).sort().join(',');
    const same = c.items.find(x => x !== cur && x.key === cur.key);          // trùng dòng khác thì gộp số lượng
    if (same) { same.qty += cur.qty; c.items = c.items.filter(x => x !== cur); }
    QO.setCart(c); draw();
  };
  paysEl.onclick = e => { const b = e.target.closest('[data-pay]'); if (b && !sending) { method = b.dataset.pay; draw(); } };

  orderBtn.onclick = async () => {
    if (sending || quoting) return;
    const c = QO.getCart();
    errEl.textContent = '';
    if (!c.items.length || !tb || !shop || !QO.isAccepting(shop)) return;
    sending = true; updateOrderButton();
    let order;
    // Mã chống gửi trùng: giữ nguyên khi lỗi mạng (gửi lại không tạo đơn thứ hai), đổi mới khi server đã trả lời lỗi.
    if (!requestId) requestId = QO.newRequestId();
    try {
      order = await QO.api('POST', 'orders', {
        shop_id: c.shop_id,
        table_id: tb.id,
        qr_token: c.table,                        // mã QR đã đổi thì server từ chối (BR-07)
        client_request_id: requestId,
        customer_name: (nameEl.value || '').trim() || 'Khách tại bàn',
        payment_method: method,
        note: noteEl.value.trim(),
        coupon_code: quote ? quote.coupon_code : '',
        items: c.items.map(i => ({dish_id: i.dish_id, quantity: i.qty, option_ids: i.options.map(o => o.id)})),
      });
    } catch (e) {
      errEl.textContent = e.message;
      if (e.name !== 'TypeError') requestId = '';     // server đã trả lời (đơn không tạo): lần gửi sau dùng mã mới
      sending = false; draw();
      return;
    }
    requestId = '';
    if (order.kind === 'PAYMENT_CHECKOUT') {
      const stored = QO.savePendingPayment({id: order.id, token: order.access_token, shop_name: shop.name, cart: JSON.stringify(c)});
      // Chưa thanh toán nên giữ giỏ; không thêm vào danh sách đơn bếp.
      location.href = new URL(QO.paymentUrl(order.id, stored ? '' : order.access_token), location.href).href;
      return;
    }
    // Tách lỗi lưu trên thiết bị khỏi lỗi gửi đơn: đơn đã tạo thì chuyển tới theo dõi.
    const saved = QO.addOrder({id: order.id, token: order.access_token, shop_id: order.shop_id, shop_name: shop.name, table_number: tb.table_number});
    try { QO.setCart({shop_id: null, table: null, items: []}); } catch {}
    const next = new URL(QO.orderTrackingUrl(order.id, saved ? '' : order.access_token), location.href);
    if (who && who.role === 'customer' && !order.in_my_history) next.searchParams.set('history', 'missing');
    location.href = next.href;
  };

  // Tải quán và xác định bàn từ mã QR đã quét (phải thuộc đúng quán trong giỏ)
  const c0 = QO.getCart();
  shop = c0.shop_id ? await QO.get('shops', c0.shop_id) : null;
  if (c0.table) {
    try {
      const r = await QO.api('GET', 'qr/' + encodeURIComponent(c0.table));
      if (shop && r.shop.id === shop.id) tb = r.table;
    } catch {}
  }

  // Điền sẵn họ tên từ tài khoản hoặc hồ sơ tạm (chỉ điền khi ô đang trống)
  const who = await QO.session();
  document.getElementById('history-note').innerHTML = who && who.role === 'customer'
    ? `Đơn sẽ được lưu vào lịch sử tài khoản ${QO.esc(who.full_name || who.email)}.`
    : 'Bạn có thể đặt với tư cách khách. <a href="account.html">Đăng nhập</a> nếu muốn lưu đơn vào lịch sử tài khoản.';
  const profile = who && who.role === 'customer' ? who : QO.getGuest();
  if (profile && nameEl && !nameEl.value) nameEl.value = profile.full_name || '';

  const dishIds = new Set(QO.getCart().items.map(i => i.dish_id));
  try {
    const [g, o] = await Promise.all([QO.all('optionGroups'), QO.all('options')]);
    groups = g.filter(x => dishIds.has(x.dish_id)); const gid = new Set(groups.map(x => x.id)); opts = o.filter(x => gid.has(x.group_id));
  } catch {}                                                                  // lỗi mạng: giỏ vẫn dùng được, chỉ không có nút Sửa

  draw();
  window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
})().catch(() => {
  document.getElementById('box').innerHTML = '<div class="empty"><b>Chưa tải được giỏ hàng</b><p>Kiểm tra kết nối rồi tải lại trang.</p></div>';
});
</script></body></html>
