<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giỏ hàng - QuickOrder</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body>
<div class="wrap">
  <a class="meta" id="back" href="home.html">← Tiếp tục chọn món</a>
  <h1 style="margin-top:8px">Giỏ hàng</h1>
  <p class="sub" id="from"></p>
  <div class="cart-grid">
    <section id="box"></section>
    <aside class="card" id="checkout">
      <h2>Tóm tắt</h2>
      <div id="sum"></div>
      <h2 style="margin-top:20px">Nhận món</h2>
      <p class="meta" id="where" style="margin:0 0 12px"></p>
      <label class="field"><span>Họ tên</span><input name="name" autocomplete="name" maxlength="60" placeholder="Tên người gọi món"></label>
      <div class="field"><span>Thanh toán</span><div class="chips" id="pays" style="margin:0"></div></div>
      <div class="meta" id="pay" style="margin:-4px 0 12px"></div>
      <label class="field"><span>Ghi chú</span><textarea name="note" rows="2" maxlength="300" placeholder="VD: ít đá, không hành"></textarea></label>
      <div class="err" id="err"></div>
      <button class="btn" type="button" id="order" disabled style="width:100%">Đặt hàng</button>
      <p class="meta" style="margin-top:10px">Đơn sẽ được gửi tới quán. Bạn theo dõi trạng thái ở mục Đơn hàng.</p>
    </aside>
  </div>
</div>
<dialog id="edlg"><form method="dialog"><h2 id="edn"></h2><div id="egs"></div><div class="err" id="eer"></div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" value="x">Hủy</button><button class="btn" id="eok" value="ok">Lưu</button></div></form></dialog>
<script>
QO.header('customer');
(async () => {
  const box = document.getElementById('box'), sum = document.getElementById('sum'), from = document.getElementById('from');
  const checkout = document.getElementById('checkout'), paysEl = document.getElementById('pays'), payEl = document.getElementById('pay');
  const whereEl = document.getElementById('where'), errEl = document.getElementById('err'), orderBtn = document.getElementById('order');
  const nameEl = document.querySelector('input[name="name"]'), noteEl = document.querySelector('textarea[name="note"]');
  const PAYS = [['CASH', 'Tiền mặt'], ['TRANSFER', 'Chuyển khoản / QR']];
  let shop = null, tb = null, method = 'CASH', sending = false;
  let groups = [], opts = [], editing = null;       // nhóm và tùy chọn của các món trong giỏ, để sửa tùy chọn
  const groupsOf = id => groups.filter(g => g.dish_id === id && opts.some(o => o.group_id === g.id)), optsOf = g => opts.filter(o => o.group_id === g.id);

  // Giá một phần = giá món + tùy chọn (khớp với giá server tính)
  const line = i => (i.price + i.options.reduce((s, o) => s + o.extra_price, 0)) * i.qty;

  const renderPay = () => {
    if (method !== 'TRANSFER') { payEl.textContent = 'Thanh toán tiền mặt khi nhận món hoặc tại quầy.'; return; }
    if (!shop) { payEl.textContent = ''; return; }
    const info = shop.bank_account_number ? 'Số tài khoản: ' + QO.esc(shop.bank_account_number) : 'Quán chưa cập nhật số tài khoản.';
    const img = shop.payment_qr_image || '';
    // Ảnh do quán tải lên (/uploads/...) hiện ngay; chỉ cho phép liên kết http(s) để tránh javascript: từ dữ liệu quán
    const qr = /^\/uploads\/[0-9a-f]{32}\.(png|jpg|webp)$/.test(img)
      ? `<div style="margin-top:8px"><img src="${QO.esc(img)}" alt="Mã QR chuyển khoản của quán" style="max-width:220px;width:100%;border:1px solid var(--line);border-radius:10px"></div>`
      : /^https?:\/\//i.test(img) ? ` · <a href="${QO.esc(img)}" target="_blank" rel="noopener">Xem mã QR</a>` : '';
    payEl.innerHTML = info + qr;
  };

  const draw = () => {
    const c = QO.getCart();
    const back = c.shop_id ? 'restaurant.html?id=' + c.shop_id + (c.table ? '&table=' + encodeURIComponent(c.table) : '') : 'home.html';
    document.getElementById('back').href = back;
    from.textContent = shop ? 'Quán: ' + shop.name : '';

    if (!c.items.length) {
      box.innerHTML = `<div class="empty"><b>Giỏ hàng trống</b><a class="btn" href="${back}">Chọn món</a></div>`;
      checkout.style.display = 'none';
      return;
    }
    checkout.style.display = '';

    const total = c.items.reduce((s, i) => s + line(i), 0), count = c.items.reduce((s, i) => s + i.qty, 0);
    box.innerHTML = '<div class="list">' + c.items.map(i => `
      <div class="item">
        <div><h3>${QO.esc(i.name)}</h3><div class="meta">${QO.esc(i.options.map(o => o.name).join(', ') || 'Không tùy chọn')}</div></div>
        <div class="acts">
          <button class="btn ghost sm" data-d="${QO.esc(i.key)}" data-n="-1" aria-label="Giảm số lượng">−</button>
          <b>${i.qty}</b>
          <button class="btn ghost sm" data-d="${QO.esc(i.key)}" data-n="1" aria-label="Tăng số lượng">+</button>
          <span class="price" style="min-width:90px;text-align:right">${QO.money(line(i))}</span>
          ${groupsOf(i.dish_id).length ? `<button class="btn ghost sm" data-e="${QO.esc(i.key)}" aria-label="Sửa tùy chọn ${QO.esc(i.name)}">Sửa</button>` : ''}
          <button class="btn bad sm" data-x="${QO.esc(i.key)}" aria-label="Xóa ${QO.esc(i.name)} khỏi giỏ">Xóa</button>
        </div>
      </div>`).join('') + '</div><div style="margin-top:12px"><button class="btn ghost sm" type="button" id="clear">Xóa toàn bộ giỏ</button></div>';

    sum.innerHTML = `<div class="kv"><span>Số món</span><b>${count}</b></div>
      <div class="row" style="margin-top:12px"><b>Tổng cộng</b><span class="price" style="font-size:20px">${QO.money(total)}</span></div>`;

    whereEl.innerHTML = tb ? `Tại bàn: <b>${QO.esc(QO.tableLabel(tb.table_number))}</b>` : 'Chưa xác định bàn. Hãy dùng camera điện thoại quét lại mã QR trên bàn.';
    paysEl.innerHTML = PAYS.map(([v, t]) => `<button type="button" class="chip${method === v ? ' on' : ''}" data-pay="${v}">${t}</button>`).join('');
    renderPay();

    const accepting = !!shop && QO.isAccepting(shop);
    orderBtn.disabled = sending || !tb || !accepting;
    orderBtn.textContent = sending ? 'Đang gửi...' : (shop && !accepting ? 'Quán hiện không nhận đơn' : 'Đặt hàng');
  };

  box.onclick = e => {
    if (e.target.closest('#clear')) {
      if (!confirm('Xóa toàn bộ món trong giỏ?')) return;
      const c = QO.getCart(); c.items = []; QO.setCart(c); draw(); return;
    }
    const ed = e.target.closest('[data-e]');
    if (ed) {
      editing = QO.getCart().items.find(x => x.key === ed.dataset.e); if (!editing) return;
      const have = new Set(editing.options.map(o => o.id));
      document.getElementById('edn').textContent = editing.name; document.getElementById('eer').textContent = '';
      document.getElementById('egs').innerHTML = groupsOf(editing.dish_id).map(g => `<fieldset class="grp" style="border:0"><legend>${QO.esc(g.name)} <span class="meta">(${g.is_required ? 'bắt buộc' : 'tùy chọn'}, chọn ${g.is_multiple ? 'nhiều' : '1'})</span></legend>${optsOf(g).map(o => `<label><input type="${g.is_multiple ? 'checkbox' : 'radio'}" name="g${g.id}" value="${o.id}"${have.has(o.id) ? ' checked' : ''}> ${QO.esc(o.name)}${o.extra_price ? ` <span class="meta">(+${QO.money(o.extra_price)})</span>` : ''}</label>`).join('')}</fieldset>`).join('');
      document.getElementById('edlg').showModal(); return;
    }
    const rm = e.target.closest('[data-x]');
    if (rm) { const c = QO.getCart(); c.items = c.items.filter(x => x.key !== rm.dataset.x); QO.setCart(c); draw(); return; }
    const b = e.target.closest('[data-d]'); if (!b) return;
    const c = QO.getCart(), i = c.items.find(x => x.key === b.dataset.d);
    if (!i) return;
    i.qty += Number(b.dataset.n);
    c.items = c.items.filter(x => x.qty > 0);
    QO.setCart(c); draw();
  };
  document.getElementById('eok').onclick = e => {
    const d = document.getElementById('edlg'), picked = [];
    for (const g of groupsOf(editing.dish_id)) {
      const sel = optsOf(g).filter(o => d.querySelector(`[name="g${g.id}"][value="${o.id}"]`).checked);
      if (!QO.validateSelection(g, sel)) { e.preventDefault(); document.getElementById('eer').textContent = `Vui lòng chọn đúng cho nhóm "${g.name}".`; return; }
      picked.push(...sel);
    }
    const c = QO.getCart(), cur = c.items.find(x => x.key === editing.key); if (!cur) return;
    cur.options = picked.map(o => ({id: o.id, name: o.name, extra_price: o.extra_price}));
    cur.key = cur.dish_id + ':' + picked.map(o => o.id).sort().join(',');
    const same = c.items.find(x => x !== cur && x.key === cur.key);          // trùng dòng khác thì gộp số lượng
    if (same) { same.qty += cur.qty; c.items = c.items.filter(x => x !== cur); }
    QO.setCart(c); draw();
  };
  paysEl.onclick = e => { const b = e.target.closest('[data-pay]'); if (b) { method = b.dataset.pay; draw(); } };

  orderBtn.onclick = async () => {
    if (sending) return;                          // chặn bấm đúp (NFR-31)
    const c = QO.getCart();
    errEl.textContent = '';
    if (!c.items.length || !tb) return;
    sending = true; draw();
    try {
      const order = await QO.api('POST', 'orders', {
        shop_id: c.shop_id,
        table_id: tb.id,
        customer_name: (nameEl.value || '').trim() || 'Khách tại bàn',
        payment_method: method,
        note: noteEl.value.trim(),
        items: c.items.map(i => ({dish_id: i.dish_id, quantity: i.qty, option_ids: i.options.map(o => o.id)})),
      });
      // Lưu mã riêng của đơn trên thiết bị này để xem và hủy đơn sau này (server chỉ trả mã này một lần)
      QO.addOrder({id: order.id, token: order.access_token, shop_id: order.shop_id, shop_name: shop.name, table_number: tb.table_number});
      QO.setCart({shop_id: null, table: null, items: []});
      location.href = 'orders.html';
    } catch (e) {
      errEl.textContent = e.message;
      sending = false; draw();
    }
  };

  // Tải quán và xác định bàn từ mã QR đã quét (phải thuộc đúng quán trong giỏ)
  const c0 = QO.getCart();
  shop = c0.shop_id ? await QO.get('shops', c0.shop_id) : null;
  if (c0.table) {
    try {
      const r = await QO.api('GET', 'qr/' + encodeURIComponent(c0.table));
      if (shop && r.shop.id === shop.id) tb = r.table;
    } catch {}
  }

  // Điền sẵn họ tên từ tài khoản hoặc hồ sơ tạm (chỉ điền khi ô đang trống)
  const who = await QO.session();
  const profile = who && who.role === 'customer' ? who : QO.getGuest();
  if (profile && nameEl && !nameEl.value) nameEl.value = profile.full_name || '';

  const dishIds = new Set(QO.getCart().items.map(i => i.dish_id));
  try {
    const [g, o] = await Promise.all([QO.all('optionGroups'), QO.all('options')]);
    groups = g.filter(x => dishIds.has(x.dish_id)); const gid = new Set(groups.map(x => x.id)); opts = o.filter(x => gid.has(x.group_id));
  } catch {}                                                                  // lỗi mạng: giỏ vẫn dùng được, chỉ không có nút Sửa

  draw();
})();
</script></body></html>
