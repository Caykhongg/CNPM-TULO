<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đơn hàng - QuickOrder</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body>
<div class="wrap">
  <h1>Đơn hàng của bạn</h1>
  <p class="sub">Trạng thái tự cập nhật. Danh sách này lưu trên thiết bị bạn đang dùng.</p>
  <div class="chips" id="chips" aria-label="Lọc theo trạng thái"></div>
  <div id="list" style="margin-top:14px"><div class="empty"><b>Đang tải...</b></div></div>
</div>
<dialog id="rv"><form method="dialog" id="rvf"><h2 id="rvt">Đánh giá đơn</h2>
  <div class="field"><span>Chấm điểm quán</span><div class="chips" id="rvs" role="radiogroup" aria-label="Điểm từ 1 đến 5 sao"></div></div>
  <div id="rvd"></div>
  <label class="field"><span>Nhận xét (không bắt buộc)</span><textarea id="rvc" rows="3" maxlength="500" placeholder="Món ăn, phục vụ, thời gian chờ..."></textarea></label>
  <div class="err" id="rve"></div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" value="x">Để sau</button><button class="btn" id="rvok" value="ok">Gửi đánh giá</button></div></form></dialog>
<script>
QO.header('customer');
(async () => {
  const chipsEl = document.getElementById('chips'), listEl = document.getElementById('list');
  // Nhóm trạng thái để lọc: CONFIRMED và PREPARING cùng là "Đang làm"
  const bucket = s => ({PENDING: 'PENDING', CONFIRMED: 'WORKING', PREPARING: 'WORKING', COMPLETED: 'COMPLETED', CANCELLED: 'CANCELLED'})[s];
  const FILTERS = [['', 'Tất cả'], ['PENDING', 'Chờ xác nhận'], ['WORKING', 'Đang làm'], ['COMPLETED', 'Hoàn thành'], ['CANCELLED', 'Đã hủy']];
  let filter = '';
  const cache = new Map();          // id đơn -> dữ liệu mới nhất từ server
  let loadError = '';

  // Đọc đơn bằng mã riêng đã lưu lúc đặt. Đơn không còn (hoặc mã sai) thì bỏ khỏi danh sách; lỗi mạng thì giữ dữ liệu cũ.
  const load = async () => {
    const saved = QO.getOrders();
    const results = await Promise.all(saved.map(s =>
      QO.api('GET', `orders/${s.id}?token=${encodeURIComponent(s.token || '')}`)
        .catch(e => e.name === 'NotFound' ? null : undefined)));
    const keep = [];
    saved.forEach((s, i) => {
      const r = results[i];
      if (r === null) return;
      keep.push(s);
      if (r) cache.set(s.id, r);
    });
    if (keep.length !== saved.length) QO.saveOrders(keep);
    loadError = results.some(r => r === undefined) ? 'Không tải được trạng thái mới nhất. Đang thử lại...' : '';
    return keep;
  };

  const card = (s, o) => {
    const [label, tone] = QO.ORDER_STATUS[o.status] || ['Không rõ', ''];
    const items = o.items.map(i => `<li>${i.quantity} × ${QO.esc(i.dish_name)}${i.note ? ` <span class="meta">(${QO.esc(i.note)})</span>` : ''}</li>`).join('');
    const pay = `${QO.PAY_METHOD[o.payment_method] || ''} · ${o.payment_status === 'PAID' ? 'Đã thanh toán' : 'Chưa thanh toán'}`;
    const rate = o.status === 'COMPLETED' ? (o.reviewed
      ? '<div class="meta" style="margin-top:10px">Bạn đã đánh giá đơn này. Cảm ơn bạn!</div>'
      : `<div style="margin-top:10px"><button class="btn sm" data-review="${o.id}">Đánh giá đơn</button></div>`) : '';
    const cancel = o.status === 'PENDING' ? `<div style="margin-top:10px"><button class="btn bad sm" data-cancel="${o.id}">Hủy đơn</button></div>` : '';
    const reason = o.status === 'CANCELLED' && o.cancel_reason ? `<div class="meta" style="margin-top:6px">Lý do: ${QO.esc(o.cancel_reason)}</div>` : '';
    return `<article class="item" style="display:block">
      <div class="row">
        <div><h3>Đơn #${o.id} · ${QO.esc(s.shop_name || 'Quán')}</h3><div class="meta">${QO.esc(QO.tableLabel(s.table_number))} · ${QO.esc(QO.fmtTime(o.created_at))}</div></div>
        <span class="tag ${tone}">${label}</span>
      </div>
      <ul style="margin:10px 0 6px;padding-left:18px">${items}</ul>
      ${o.note ? `<div class="meta">Ghi chú: ${QO.esc(o.note)}</div>` : ''}
      <div class="row" style="margin-top:8px"><span class="meta">${pay}</span><span class="price">${QO.money(o.total_amount)}</span></div>
      ${o.discount_amount ? `<div class="meta" style="margin-top:4px">Đã giảm ${QO.money(o.discount_amount)} (mã ${QO.esc(o.coupon_code)})</div>` : ''}
      ${reason}
      ${cancel}${rate}
    </article>`;
  };

  const draw = saved => {
    chipsEl.innerHTML = FILTERS.map(([v, t]) => `<button type="button" class="chip${filter === v ? ' on' : ''}" data-f="${v}">${t}</button>`).join('');
    if (!saved.length) {
      listEl.innerHTML = '<div class="empty"><b>Chưa có đơn hàng</b>Đơn bạn gửi từ bàn sẽ hiện ở đây. Dùng camera điện thoại quét mã QR trên bàn để bắt đầu gọi món.</div>';
      return;
    }
    const rows = saved.map(s => ({s, o: cache.get(s.id)})).filter(({o}) => o && (!filter || bucket(o.status) === filter));
    const note = loadError ? `<div class="err" style="margin-bottom:12px">${QO.esc(loadError)}</div>` : '';
    listEl.innerHTML = note + (rows.length
      ? '<div class="list">' + rows.map(({s, o}) => card(s, o)).join('') + '</div>'
      : '<div class="empty"><b>Không có đơn ở mục này</b></div>');
  };

  chipsEl.onclick = e => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; draw(QO.getOrders()); } };

  // ----- Đánh giá đơn đã hoàn thành (FR-24) -----
  const rv = document.getElementById('rv'), rvs = document.getElementById('rvs'), rve = document.getElementById('rve');
  let reviewing = null, stars = 0, dishStars = {};
  const starBtns = (cur, attr) => [1, 2, 3, 4, 5].map(n => `<button type="button" class="chip${cur === n ? ' on' : ''}" ${attr}="${n}" role="radio" aria-checked="${cur === n}" aria-label="${n} sao">${n}★</button>`).join('');
  const drawRv = () => {
    rvs.innerHTML = starBtns(stars, 'data-s');
    document.getElementById('rvd').innerHTML = reviewing.items.length > 1 ? '<div class="meta" style="margin-bottom:6px">Chấm riêng từng món (không bắt buộc)</div>' + reviewing.items.map(i =>
      `<div class="field"><span>${QO.esc(i.dish_name)}</span><div class="chips" data-dish="${i.dish_id}" style="margin:0">${starBtns(dishStars[i.dish_id] || 0, 'data-ds')}</div></div>`).join('') : '';
  };
  rvs.onclick = e => { const b = e.target.closest('[data-s]'); if (b) { stars = Number(b.dataset.s); drawRv(); } };
  document.getElementById('rvd').onclick = e => {
    const b = e.target.closest('[data-ds]'); if (!b) return;
    const id = Number(b.closest('[data-dish]').dataset.dish), n = Number(b.dataset.ds);
    if (dishStars[id] === n) delete dishStars[id]; else dishStars[id] = n;          // bấm lại để bỏ chọn
    drawRv();
  };
  document.getElementById('rvok').onclick = async e => {
    e.preventDefault(); rve.textContent = '';
    if (!stars) { rve.textContent = 'Vui lòng chọn số sao cho quán.'; return; }
    const saved = QO.getOrders().find(x => x.id === reviewing.id);
    const btn = e.currentTarget; btn.disabled = true;
    try {
      await QO.api('POST', 'orders/' + reviewing.id + '/review', {token: saved ? saved.token : '', rating: stars,
        comment: document.getElementById('rvc').value.trim(),
        dishes: Object.entries(dishStars).map(([dish_id, rating]) => ({dish_id: Number(dish_id), rating}))});
      rv.close(); QO.toast('Cảm ơn bạn đã đánh giá!');
      cache.set(reviewing.id, {...reviewing, reviewed: true}); draw(QO.getOrders());
    } catch (err) {
      if (err.name === 'ConstraintError' && /đã được đánh giá/.test(err.message)) { rv.close(); cache.set(reviewing.id, {...reviewing, reviewed: true}); draw(QO.getOrders()); }
      rve.textContent = err.message;
    }
    btn.disabled = false;
  };

  listEl.onclick = async e => {
    const rb = e.target.closest('[data-review]');
    if (rb) {
      reviewing = cache.get(Number(rb.dataset.review)); if (!reviewing) return;
      stars = 0; dishStars = {}; rve.textContent = ''; document.getElementById('rvc').value = '';
      document.getElementById('rvt').textContent = 'Đánh giá đơn #' + reviewing.id; drawRv(); rv.showModal(); return;
    }
    const b = e.target.closest('[data-cancel]'); if (!b) return;
    if (!confirm('Hủy đơn này?')) return;
    const saved = QO.getOrders().find(x => x.id === Number(b.dataset.cancel));
    if (!saved) return;
    b.disabled = true;
    try {
      const o = await QO.api('PUT', 'orders/' + saved.id + '/cancel', {token: saved.token || ''});
      cache.set(o.id, o);
      QO.toast('Đã hủy đơn #' + o.id);
    } catch (err) {
      QO.toast(err.message);
    }
    draw(QO.getOrders());
  };

  const tick = async () => {
    if (document.hidden) return;
    draw(await load());
  };
  await tick();
  setInterval(tick, 7000);
})();
</script>
</body></html>
