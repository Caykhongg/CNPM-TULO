<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Theo dõi đơn - QuickOrder</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/order-tracking.css">
  <script src="../js/app.js"></script>
</head>
<body>
  <main class="wrap tracking-page">
    <div class="row tracking-heading">
      <div><a class="meta" href="orders.html">← Danh sách đơn của bạn</a><h1 id="tracking-title">Theo dõi đơn</h1></div>
      <button class="btn ghost sm" type="button" id="refresh-order">Tải lại</button>
    </div>
    <p class="sub" id="tracking-updated" role="status" aria-live="polite">Đang tải trạng thái đơn...</p>
    <p class="err" id="tracking-error" role="alert" hidden></p>
    <p class="card" id="history-warning" hidden>Đơn đã gửi thành công nhưng chưa lưu vào tài khoản vì phiên đăng nhập thay đổi. Đăng nhập tài khoản khách rồi mở <a href="history.html">Lịch sử</a> để lưu đơn.</p>
    <div id="tracking-root"><div class="empty"><b>Đang tải đơn hàng...</b></div></div>
  </main>
  <script src="../js/order-tracking.js"></script>
</body>
</html>
