<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickOrder - Chủ quán</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body>
<div class="wrap"><h1>Mã giảm giá</h1><p class="sub">Tạo mã để khách nhập ở giỏ hàng. Mỗi đơn dùng một mã; đơn bị hủy sẽ trả lại lượt dùng.</p><div id="root"></div></div>
<script>
QO.header('merchant');
(async () => { await QO.requireOwner(); const shop = await QO.myShop(), root = document.getElementById('root');
  if (!shop) { root.innerHTML = '<div class="empty"><b>Bạn chưa tạo quán</b><a class="btn" href="shop.html">Tạo quán</a></div>'; return; }
  root.innerHTML = `<div class="split"><form class="card" id="f"><h2>Thêm mã</h2>
    <label class="field"><span>Mã (3–20 ký tự chữ, số)</span><input name="code" required maxlength="20" style="text-transform:uppercase"></label>
    <label class="field"><span>Loại giảm</span><select name="discount_type"><option value="PERCENT">Theo phần trăm (%)</option><option value="AMOUNT">Số tiền cố định (đ)</option></select></label>
    <label class="field"><span>Giá trị giảm</span><input name="discount_value" type="number" min="1" required></label>
    <label class="field"><span>Đơn tối thiểu (đ)</span><input name="min_order" type="number" min="0" value="0"></label>
    <label class="field"><span>Từ ngày</span><input name="start_date" type="date"></label>
    <label class="field"><span>Đến hết ngày</span><input name="end_date" type="date"></label>
    <label class="field"><span>Số lượt tối đa (0 = không giới hạn)</span><input name="max_uses" type="number" min="0" value="0"></label>
    <div class="err" id="er"></div><button class="btn" style="width:100%">Thêm mã</button></form><div class="list" id="ls"></div></div>`;
  const f = document.getElementById('f'), er = document.getElementById('er'), ls = document.getElementById('ls');
  const STATE = {ACTIVE:['Đang dùng được','ok'], OFF:['Đang tắt','no'], SCHEDULED:['Chưa tới ngày','wait'], EXPIRED:['Hết hạn','no'], USED_UP:['Hết lượt','no']};
  const fmtD = s => s ? s.split('-').reverse().join('/') : '';
  const item = c => { const [t, tone] = STATE[c.state];
    return `<div class="item" style="flex-wrap:wrap"><div><h3>${QO.esc(c.code)} <span class="tag ${tone}">${t}</span></h3>
      <div class="meta">Giảm ${c.discount_type === 'PERCENT' ? c.discount_value + '%' : QO.money(c.discount_value)}${c.min_order ? ' · đơn từ ' + QO.money(c.min_order) : ''}
      · đã dùng ${c.used_count}${c.max_uses ? '/' + c.max_uses : ''} lượt${c.start_date || c.end_date ? ' · ' + (fmtD(c.start_date) || '...') + ' → ' + (fmtD(c.end_date) || '...') : ''}</div></div>
      <div class="acts"><button class="btn ghost sm" data-tg="${c.id}" data-on="${c.is_active ? 0 : 1}">${c.is_active ? 'Tắt' : 'Bật'}</button><button class="btn bad sm" data-rm="${c.id}">Xóa</button></div></div>`; };
  const draw = async () => { const cs = await QO.by('coupons', 'shop_id', shop.id);
    ls.innerHTML = cs.length ? cs.map(item).join('') : '<div class="empty"><b>Chưa có mã nào</b>Thêm mã đầu tiên ở bên trái.</div>'; };
  f.onsubmit = async e => { e.preventDefault(); er.textContent = '';
    const v = Object.fromEntries(new FormData(f)); v.shop_id = shop.id;
    try { await QO.api('POST', 'coupons', v); f.reset(); QO.toast('Đã thêm mã'); draw(); } catch (x) { er.textContent = x.message; } };
  ls.onclick = async e => { const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.tg) await QO.api('PUT', 'coupons/' + b.dataset.tg, {is_active: b.dataset.on === '1'});
      if (b.dataset.rm && confirm('Xóa mã này? Các đơn đã dùng mã vẫn giữ nguyên giảm giá.')) await QO.api('DELETE', 'coupons/' + b.dataset.rm);
    } catch (x) { QO.toast(x.message); } draw(); };
  draw(); })();
</script></body></html>
