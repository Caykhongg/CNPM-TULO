<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickOrder - Chủ quán</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body>
<div class="wrap" style="max-width:480px"><h1>Chủ quán</h1><p class="sub">Đăng ký tài khoản để tạo quán và quản lý menu.</p>
<div class="chips"><button class="chip on" id="tl">Đăng nhập</button><button class="chip" id="tr">Đăng ký</button></div>
<form class="card" id="f">
  <div id="reg"><label class="field"><span>Họ tên</span><input name="full_name"></label><label class="field"><span>Số điện thoại</span><input name="phone" type="tel"></label></div>
  <label class="field"><span>Email</span><input name="email" type="email" required></label>
  <label class="field"><span>Mật khẩu</span><input name="password" type="password" minlength="6" required></label>
  <div class="err" id="er"></div><button class="btn" style="width:100%" id="go">Đăng nhập</button></form></div>
<script>
QO.header('merchant');
QO.session().then(u => { if (u && u.role === 'owner') location.replace('dashboard.html'); });
let isReg = false; const f = document.getElementById('f'), reg = document.getElementById('reg');
const mode = r => { isReg = r; reg.style.display = r ? '' : 'none'; reg.querySelectorAll('input').forEach(i => i.required = r);
  tl.classList.toggle('on', !r); tr.classList.toggle('on', r); go.textContent = r ? 'Tạo tài khoản' : 'Đăng nhập'; er.textContent = ''; };
tl.onclick = () => mode(false); tr.onclick = () => mode(true); mode(false);
f.onsubmit = async e => { e.preventDefault(); const v = Object.fromEntries(new FormData(f)), email = v.email.trim().toLowerCase();
  try {
    const u = isReg
      ? await QO.api('POST', 'register', {full_name: v.full_name.trim(), email, phone: v.phone.trim(), password: v.password})
      : await QO.api('POST', 'login', {email, password: v.password});
    if (u.role !== 'owner') { await QO.api('POST', 'logout').catch(() => {}); throw new Error('Tài khoản này không phải tài khoản chủ quán.'); }
    location.href = 'dashboard.html';
  } catch (x) { er.textContent = x.name === 'ConstraintError' ? 'Email này đã được đăng ký.' : (x.message || 'Không lưu được dữ liệu.'); } };
</script></body></html>
