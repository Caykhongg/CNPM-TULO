<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickOrder - Chủ quán</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script><script src="../js/vendor/qrcode.js"></script></head><body>
<div class="wrap"><h1>Bàn &amp; mã QR</h1><p class="sub">Mỗi bàn có một liên kết riêng. Tải mã QR của bàn rồi dán lên bàn để khách quét bằng camera điện thoại.</p><div id="root"></div></div>
<script>
QO.header('merchant');
(async () => { await QO.requireOwner(); const shop = await QO.myShop(), root = document.getElementById('root');
  if (!shop) { root.innerHTML = '<div class="empty"><b>Bạn chưa tạo quán</b><a class="btn" href="shop.html">Tạo quán</a></div>'; return; }
  root.innerHTML = '<div class="split"><form class="card" id="f"><h2>Thêm bàn</h2><label class="field"><span>Số hoặc tên bàn</span><input name="table_number" required></label><div class="err" id="er"></div><button class="btn" style="width:100%">Thêm bàn</button></form><div class="list" id="ls"></div></div>';
  const f = document.getElementById('f'), er = document.getElementById('er'), ls = document.getElementById('ls');

  const item = t => `<div class="item" style="flex-wrap:wrap">
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <img data-qr="${t.id}" alt="Mã QR bàn ${QO.esc(t.table_number)}" width="120" height="120" style="border:1px solid var(--line);border-radius:10px;background:#fff">
        <div><h3>Bàn ${QO.esc(t.table_number)}</h3><div class="link">${QO.esc(QO.qrUrl(t))}</div><div class="meta" data-qrerr="${t.id}"></div></div>
      </div>
      <div class="acts"><a class="btn sm" data-dl="${t.id}" download="ban-${QO.esc(t.table_number)}.png" hidden>Tải mã QR</a><button class="btn ghost sm" data-cp="${t.id}">Sao chép</button><button class="btn warn sm" data-rg="${t.id}">Đổi mã</button><button class="btn bad sm" data-rm="${t.id}">Xóa</button></div></div>`;

  // Vẽ mã QR ngay trên trình duyệt bằng thư viện đi kèm (js/vendor/qrcode.js), không tải gì từ mạng ngoài.
  const qrPng = text => {
    const m = QRLib.matrix(text), n = m.length, scale = 10, quiet = 4;   // quiet: vùng trắng bao quanh, theo quy định của mã QR
    const cv = document.createElement('canvas');
    cv.width = cv.height = (n + quiet * 2) * scale;
    const g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
    g.fillStyle = '#000';
    m.forEach((row, r) => row.forEach((dark, c) => { if (dark) g.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale); }));
    return cv.toDataURL('image/png');
  };

  // Đổi mã làm liên kết mới, nên ảnh QR cũ đã in sẽ không dùng được nữa.
  const drawQr = ts => {
    for (const t of ts) {
      const img = ls.querySelector(`[data-qr="${t.id}"]`), err = ls.querySelector(`[data-qrerr="${t.id}"]`), dl = ls.querySelector(`[data-dl="${t.id}"]`);
      if (!img) continue;
      if (!window.QRLib) { err.textContent = 'Không tải được thư viện tạo mã QR. Hãy tải lại trang.'; continue; }
      try {
        const src = qrPng(QO.qrUrl(t));
        img.src = src; dl.href = src; dl.hidden = false;
      } catch {
        err.textContent = 'Không tạo được mã QR cho bàn này.';
      }
    }
  };

  const draw = async () => { const ts = await QO.by('tables', 'shop_id', shop.id);
    ls.innerHTML = ts.length ? ts.map(item).join('') : '<div class="empty"><b>Chưa có bàn nào</b>Thêm bàn đầu tiên ở bên trái.</div>';
    if (ts.length) drawQr(ts); };

  f.onsubmit = async e => { e.preventDefault(); const n = f.table_number.value.trim(), ts = await QO.by('tables', 'shop_id', shop.id);
    if (ts.some(t => t.table_number.toLowerCase() === n.toLowerCase())) { er.textContent = 'Tên bàn đã tồn tại trong quán.'; return; }
    er.textContent = ''; await QO.put('tables', {shop_id: shop.id, table_number: n}); f.reset(); draw(); };
  ls.onclick = async e => { const b = e.target.closest('button'); if (!b) return; const id = b.dataset.cp || b.dataset.rg || b.dataset.rm, t = await QO.get('tables', id);
    if (b.dataset.cp) { navigator.clipboard && navigator.clipboard.writeText(QO.qrUrl(t)); QO.toast('Đã sao chép liên kết'); }
    if (b.dataset.rg) { await QO.put('tables', {...t, regenerate: true}); QO.toast('Đã tạo mã mới, mã cũ vô hiệu'); }
    if (b.dataset.rm && confirm('Xóa bàn ' + t.table_number + '?')) await QO.del('tables', id); draw(); };
  draw(); })();
</script></body></html>
