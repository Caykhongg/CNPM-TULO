<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Foodie - Thống kê</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        foodie: {
                            red: '#EE4D2D',
                            redDark: '#D03E1F',
                            orange: '#FF6B00',
                            green: '#00B14F',
                            greenDark: '#00883C'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full min-h-screen bg-slate-50 text-slate-800 font-sans">
    <div id="app-shell">
        <!-- Top Global Switcher Header -->
    <header class="w-full bg-slate-900 border-b border-slate-800 text-white p-3 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-xl z-50">
        <div class="flex items-center gap-3">
            <div id="brand-logo-icon" class="w-9 h-9 bg-foodie-red rounded-xl flex items-center justify-center font-black text-xl shadow-lg transition-colors">
                F
            </div>
            <div>
                <h1 class="font-bold text-sm sm:text-base flex items-center gap-2">
                    Foodie Platform Prototype
                    <span id="role-badge" class="text-[10px] bg-foodie-red/20 text-foodie-red font-semibold px-2 py-0.5 rounded-full border border-foodie-red/30">
                        Người Dùng
                    </span>
                </h1>
                <p class="text-xs text-slate-400">Chuyển đổi giao diện để trải nghiệm cả 2 góc nhìn</p>
            </div>
        </div>

        <!-- Role Toggle Tabs -->
        <div class="flex bg-slate-800 p-1 rounded-xl w-full sm:w-auto">
            <button onclick="switchRole('customer')" id="role-btn-customer" 
                    class="flex-1 sm:flex-initial px-5 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 bg-foodie-red text-white shadow-md">
                <i data-lucide="user" class="w-4 h-4"></i>
                <span>Người Dùng</span>
            </button>
            <button onclick="switchRole('merchant')" id="role-btn-merchant" 
                    class="flex-1 sm:flex-initial px-5 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white">
                <i data-lucide="store" class="w-4 h-4"></i>
                <span>Chủ Quán</span>
            </button>
        </div>
    </header>
        <main class="app-main">
            <div class="app-screen responsive-content">
                <section id="merch-screen-analytics" class="p-4 space-y-4">
                    <h3 class="font-bold text-sm text-slate-800">Thống kê</h3>

                    <!-- Time Filter Bar -->
                    <div class="flex bg-slate-100 p-1 rounded-xl text-xs">
                        <button class="flex-1 py-1 font-bold rounded-lg bg-white shadow-sm text-slate-800">Hôm nay</button>
                        <button class="flex-1 py-1 font-semibold text-slate-400">7 ngày</button>
                        <button class="flex-1 py-1 font-semibold text-slate-400">30 ngày</button>
                    </div>

                    <!-- Summary Cards -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-3 rounded-2xl border border-slate-100">
                            <p class="text-[10px] text-slate-400 font-bold uppercase">Tổng doanh thu</p>
                            <h4 class="text-lg font-black text-slate-800 mt-1">2.850.000đ</h4>
                        </div>
                        <div class="bg-white p-3 rounded-2xl border border-slate-100">
                            <p class="text-[10px] text-slate-400 font-bold uppercase">Tổng đơn hàng</p>
                            <h4 class="text-lg font-black text-slate-800 mt-1">36</h4>
                        </div>
                    </div>

                    <!-- Mock Revenue Graph -->
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 space-y-2">
                        <h4 class="font-bold text-xs text-slate-800">Doanh thu</h4>
                        <div class="h-32 w-full flex items-end gap-2 pt-4">
                            <div class="flex-1 bg-emerald-100 hover:bg-foodie-green h-[40%] rounded-t-md transition"></div>
                            <div class="flex-1 bg-emerald-100 hover:bg-foodie-green h-[60%] rounded-t-md transition"></div>
                            <div class="flex-1 bg-emerald-100 hover:bg-foodie-green h-[85%] rounded-t-md transition"></div>
                            <div class="flex-1 bg-foodie-green h-[100%] rounded-t-md"></div>
                        </div>
                    </div>
                </section>
            </div>
            <!-- Merchant Bottom Navigation Bar -->
            <nav class="absolute bottom-0 left-0 right-0 h-14 bg-white border-t border-slate-200 flex items-center justify-around z-20">
                <button onclick="navigateMerchantTab('dashboard')" id="merch-nav-dashboard" class="flex flex-col items-center gap-0.5 text-foodie-green">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span class="text-[9px] font-bold">Trang chủ</span>
                </button>
                <button onclick="navigateMerchantTab('orders')" id="merch-nav-orders" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-600">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span class="text-[9px] font-bold">Đơn hàng</span>
                </button>
                <button onclick="navigateMerchantTab('menu')" id="merch-nav-menu" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-600">
                    <i data-lucide="utensils-crossed" class="w-4 h-4"></i>
                    <span class="text-[9px] font-bold">Thực đơn</span>
                </button>
                <button onclick="navigateMerchantTab('profile')" id="merch-nav-profile" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-600">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    <span class="text-[9px] font-bold">Tài khoản</span>
                </button>
            </nav>
        </main>
        <div id="app-toast"
    class="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs font-semibold
           px-4 py-2 rounded-full shadow-2xl z-[100] transition-all duration-300
           pointer-events-none opacity-0 translate-y-[-10px] flex items-center gap-2">
    <span id="toast-message">Thông báo</span>
</div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
