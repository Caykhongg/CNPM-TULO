<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Foodie - Chủ quán đăng nhập</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        foodie: {
                            red: '#EE4D2D',
                            redDark: '#D03E1F',
                            orange: '#FF6B00',
                            green: '#00B14F',
                            greenDark: '#00883C'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full min-h-screen bg-slate-50 text-slate-800 font-sans">
    <div id="app-shell">
        <!-- Top Global Switcher Header -->
    <header class="w-full bg-slate-900 border-b border-slate-800 text-white p-3 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-xl z-50">
        <div class="flex items-center gap-3">
            <div id="brand-logo-icon" class="w-9 h-9 bg-foodie-red rounded-xl flex items-center justify-center font-black text-xl shadow-lg transition-colors">
                F
            </div>
            <div>
                <h1 class="font-bold text-sm sm:text-base flex items-center gap-2">
                    Foodie Platform Prototype
                    <span id="role-badge" class="text-[10px] bg-foodie-red/20 text-foodie-red font-semibold px-2 py-0.5 rounded-full border border-foodie-red/30">
                        Người Dùng
                    </span>
                </h1>
                <p class="text-xs text-slate-400">Chuyển đổi giao diện để trải nghiệm cả 2 góc nhìn</p>
            </div>
        </div>

        <!-- Role Toggle Tabs -->
        <div class="flex bg-slate-800 p-1 rounded-xl w-full sm:w-auto">
            <button onclick="switchRole('customer')" id="role-btn-customer" 
                    class="flex-1 sm:flex-initial px-5 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 bg-foodie-red text-white shadow-md">
                <i data-lucide="user" class="w-4 h-4"></i>
                <span>Người Dùng</span>
            </button>
            <button onclick="switchRole('merchant')" id="role-btn-merchant" 
                    class="flex-1 sm:flex-initial px-5 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white">
                <i data-lucide="store" class="w-4 h-4"></i>
                <span>Chủ Quán</span>
            </button>
        </div>
    </header>
        <main class="app-main">
            <div class="app-screen responsive-content">
                <section id="merch-screen-login" class="min-h-[calc(100dvh-100px)] flex flex-col justify-center p-6 bg-emerald-50/50">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-foodie-green text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-foodie-green/30">
                            <i data-lucide="store" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-xl font-bold text-slate-900">Foodie - Chủ quán</h2>
                        <p class="text-xs text-slate-500 mt-1">Quản lý dễ dàng - Tăng doanh thu hiệu quả</p>
                    </div>

                    <form onsubmit="event.preventDefault(); navigateMerchantTab('dashboard');" class="space-y-3">
                        <div>
                            <input type="text" value="0901234567" placeholder="Số điện thoại / Email" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-xs outline-none focus:border-foodie-green">
                        </div>
                        <div>
                            <input type="password" value="password" placeholder="Mật khẩu" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-xs outline-none focus:border-foodie-green">
                        </div>
                        <button type="submit" class="w-full py-3 bg-foodie-green hover:bg-foodie-greenDark text-white text-xs font-bold rounded-xl shadow-md transition">
                            Đăng nhập
                        </button>
                    </form>
                </section>
            </div>
            
        </main>
        <div id="app-toast"
    class="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs font-semibold
           px-4 py-2 rounded-full shadow-2xl z-[100] transition-all duration-300
           pointer-events-none opacity-0 translate-y-[-10px] flex items-center gap-2">
    <span id="toast-message">Thông báo</span>
</div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
