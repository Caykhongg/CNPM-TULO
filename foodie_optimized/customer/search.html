<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Foodie - Tìm kiếm</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        foodie: {
                            red: '#EE4D2D',
                            redDark: '#D03E1F',
                            orange: '#FF6B00',
                            green: '#00B14F',
                            greenDark: '#00883C'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full min-h-screen bg-slate-50 text-slate-800 font-sans">
    <div id="app-shell">
        <!-- Top Global Switcher Header -->
    <header class="w-full bg-slate-900 border-b border-slate-800 text-white p-3 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-xl z-50">
        <div class="flex items-center gap-3">
            <div id="brand-logo-icon" class="w-9 h-9 bg-foodie-red rounded-xl flex items-center justify-center font-black text-xl shadow-lg transition-colors">
                F
            </div>
            <div>
                <h1 class="font-bold text-sm sm:text-base flex items-center gap-2">
                    Foodie Platform Prototype
                    <span id="role-badge" class="text-[10px] bg-foodie-red/20 text-foodie-red font-semibold px-2 py-0.5 rounded-full border border-foodie-red/30">
                        Người Dùng
                    </span>
                </h1>
                <p class="text-xs text-slate-400">Chuyển đổi giao diện để trải nghiệm cả 2 góc nhìn</p>
            </div>
        </div>

        <!-- Role Toggle Tabs -->
        <div class="flex bg-slate-800 p-1 rounded-xl w-full sm:w-auto">
            <button onclick="switchRole('customer')" id="role-btn-customer" 
                    class="flex-1 sm:flex-initial px-5 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 bg-foodie-red text-white shadow-md">
                <i data-lucide="user" class="w-4 h-4"></i>
                <span>Người Dùng</span>
            </button>
            <button onclick="switchRole('merchant')" id="role-btn-merchant" 
                    class="flex-1 sm:flex-initial px-5 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white">
                <i data-lucide="store" class="w-4 h-4"></i>
                <span>Chủ Quán</span>
            </button>
        </div>
    </header>
        <main class="app-main">
            <div class="app-screen responsive-content">
                <section id="cust-screen-search" class="p-4 space-y-3">
                    <div class="flex items-center gap-2">
                        <div class="flex-1 bg-slate-100 px-3 py-2 rounded-xl flex items-center gap-2">
                            <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                            <input type="text" value="Bún bò" class="bg-transparent text-xs font-semibold text-slate-800 outline-none w-full" placeholder="Tìm món ăn...">
                            <button onclick="navigateCustomerTab('home')" class="text-xs text-slate-400">Hủy</button>
                        </div>
                    </div>

                    <!-- Filter Pills -->
                    <div class="flex gap-2 overflow-x-auto hide-scrollbar py-1">
                        <button class="bg-foodie-red text-white text-xs font-semibold px-3.5 py-1.5 rounded-full shrink-0">Tất cả</button>
                        <button class="bg-slate-100 text-slate-600 text-xs font-semibold px-3.5 py-1.5 rounded-full shrink-0 hover:bg-slate-200">Quán ăn</button>
                        <button class="bg-slate-100 text-slate-600 text-xs font-semibold px-3.5 py-1.5 rounded-full shrink-0 hover:bg-slate-200">Món ăn</button>
                    </div>

                    <!-- Results List -->
                    <div class="space-y-3 pt-1">
                        <!-- Result Item 1 -->
                        <div onclick="navigateCustomerTab('restaurant')" class="bg-white p-2.5 rounded-2xl border border-slate-100 flex gap-3 shadow-sm cursor-pointer hover:border-foodie-red/30 transition">
                            <img src="https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?auto=format&fit=crop&q=80&w=200" class="w-20 h-20 rounded-xl object-cover" alt="An Nam">
                            <div class="flex-1">
                                <h4 class="font-bold text-xs text-slate-800">Bún Bò Huế An Nam</h4>
                                <p class="text-[10px] text-slate-400 mt-0.5">1.2 km • 20 - 30 phút</p>
                                <div class="flex items-center gap-2 text-[11px] text-slate-500 mt-1">
                                    <span class="text-amber-500 font-bold">⭐ 4.8</span>
                                    <span>(1.2k đánh giá)</span>
                                </div>
                                <span class="inline-block mt-1 bg-red-50 text-foodie-red text-[10px] font-bold px-1.5 py-0.5 rounded">Giảm 20%</span>
                            </div>
                        </div>

                        <!-- Result Item 2 -->
                        <div onclick="navigateCustomerTab('restaurant')" class="bg-white p-2.5 rounded-2xl border border-slate-100 flex gap-3 shadow-sm cursor-pointer hover:border-foodie-red/30 transition">
                            <img src="https://images.unsplash.com/photo-1541832676-9b763b0239ab?auto=format&fit=crop&q=80&w=200" class="w-20 h-20 rounded-xl object-cover" alt="3 Miền">
                            <div class="flex-1">
                                <h4 class="font-bold text-xs text-slate-800">Bún Bò 3 Miền</h4>
                                <p class="text-[10px] text-slate-400 mt-0.5">2.5 km • 25 - 35 phút</p>
                                <div class="flex items-center gap-2 text-[11px] text-slate-500 mt-1">
                                    <span class="text-amber-500 font-bold">⭐ 4.6</span>
                                    <span>(664)</span>
                                </div>
                            </div>
                        </div>

                        <!-- Result Item 3 -->
                        <div onclick="navigateCustomerTab('restaurant')" class="bg-white p-2.5 rounded-2xl border border-slate-100 flex gap-3 shadow-sm cursor-pointer hover:border-foodie-red/30 transition">
                            <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&q=80&w=200" class="w-20 h-20 rounded-xl object-cover" alt="Ú Hương">
                            <div class="flex-1">
                                <h4 class="font-bold text-xs text-slate-800">Bún Bò Ú Hương</h4>
                                <p class="text-[10px] text-slate-400 mt-0.5">0.8 km • 15 - 25 phút</p>
                                <div class="flex items-center gap-2 text-[11px] text-slate-500 mt-1">
                                    <span class="text-amber-500 font-bold">⭐ 4.5</span>
                                    <span>(420)</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
            <!-- Customer Bottom Navigation Bar -->
            <nav class="absolute bottom-0 left-0 right-0 h-14 bg-white border-t border-slate-200 flex items-center justify-around z-20">
                <button onclick="navigateCustomerTab('home')" id="cust-nav-home" class="flex flex-col items-center gap-0.5 text-foodie-red">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    <span class="text-[9px] font-bold">Trang chủ</span>
                </button>
                <button onclick="navigateCustomerTab('tracking')" id="cust-nav-tracking" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-600">
                    <i data-lucide="clipboard-list" class="w-4 h-4"></i>
                    <span class="text-[9px] font-bold">Đơn hàng</span>
                </button>
                <button onclick="navigateCustomerTab('cart')" id="cust-nav-cart" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-600">
                    <i data-lucide="heart" class="w-4 h-4"></i>
                    <span class="text-[9px] font-bold">Yêu thích</span>
                </button>
                <button onclick="navigateCustomerTab('profile')" id="cust-nav-profile" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-600">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    <span class="text-[9px] font-bold">Tài khoản</span>
                </button>
            </nav>
        </main>
        <div id="app-toast"
    class="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs font-semibold
           px-4 py-2 rounded-full shadow-2xl z-[100] transition-all duration-300
           pointer-events-none opacity-0 translate-y-[-10px] flex items-center gap-2">
    <span id="toast-message">Thông báo</span>
</div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
