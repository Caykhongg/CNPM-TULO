<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Foodie - Trang chủ</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        foodie: {
                            red: '#EE4D2D',
                            redDark: '#D03E1F',
                            orange: '#FF6B00',
                            green: '#00B14F',
                            greenDark: '#00883C'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full min-h-screen bg-slate-50 text-slate-800 font-sans">
    <div id="app-shell">
        <!-- Top Global Switcher Header -->
    <header class="w-full bg-slate-900 border-b border-slate-800 text-white p-3 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-xl z-50">
        <div class="flex items-center gap-3">
            <div id="brand-logo-icon" class="w-9 h-9 bg-foodie-red rounded-xl flex items-center justify-center font-black text-xl shadow-lg transition-colors">
                F
            </div>
            <div>
                <h1 class="font-bold text-sm sm:text-base flex items-center gap-2">
                    Foodie Platform Prototype
                    <span id="role-badge" class="text-[10px] bg-foodie-red/20 text-foodie-red font-semibold px-2 py-0.5 rounded-full border border-foodie-red/30">
                        Người Dùng
                    </span>
                </h1>
                <p class="text-xs text-slate-400">Chuyển đổi giao diện để trải nghiệm cả 2 góc nhìn</p>
            </div>
        </div>

        <!-- Role Toggle Tabs -->
        <div class="flex bg-slate-800 p-1 rounded-xl w-full sm:w-auto">
            <button onclick="switchRole('customer')" id="role-btn-customer" 
                    class="flex-1 sm:flex-initial px-5 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 bg-foodie-red text-white shadow-md">
                <i data-lucide="user" class="w-4 h-4"></i>
                <span>Người Dùng</span>
            </button>
            <button onclick="switchRole('merchant')" id="role-btn-merchant" 
                    class="flex-1 sm:flex-initial px-5 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white">
                <i data-lucide="store" class="w-4 h-4"></i>
                <span>Chủ Quán</span>
            </button>
        </div>
    </header>
        <main class="app-main">
            <div class="app-screen responsive-content">
                <section id="cust-screen-home" class="p-4 space-y-4">
                    <!-- Location & Header -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-1.5 text-xs font-bold text-slate-800">
                            <i data-lucide="map-pin" class="w-4 h-4 text-foodie-red"></i>
                            <span class="truncate max-w-[180px]">TP. Hồ Chí Minh</span>
                            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
                        </div>
                        <button onclick="showToast('Bạn có 2 thông báo mới', 'info')" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center relative">
                            <i data-lucide="bell" class="w-4 h-4 text-slate-700"></i>
                            <span class="absolute top-1 right-1 w-2 h-2 bg-foodie-red rounded-full"></span>
                        </button>
                    </div>

                    <!-- Search Input Prompt -->
                    <div onclick="navigateCustomerTab('search')" class="bg-slate-100 px-3.5 py-2.5 rounded-xl flex items-center gap-2 text-slate-400 text-xs cursor-pointer hover:bg-slate-200/70 transition">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                        <span>Tìm kiếm món ăn, quán ăn...</span>
                    </div>

                    <!-- Promo Banner -->
                    <div class="bg-gradient-to-r from-foodie-red to-orange-500 rounded-2xl p-4 text-white relative overflow-hidden shadow-lg shadow-foodie-red/20">
                        <div class="max-w-[60%]">
                            <span class="bg-white/20 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide">Ưu đãi hôm nay</span>
                            <h3 class="text-xl font-extrabold mt-1">Giảm đến 50%</h3>
                            <button onclick="navigateCustomerTab('restaurant')" class="mt-2 px-3 py-1 bg-white text-foodie-red text-xs font-bold rounded-lg shadow-sm hover:bg-orange-50">
                                Xem ngay
                            </button>
                        </div>
                        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&q=80&w=200" 
                             class="absolute -right-4 -bottom-4 w-32 h-32 object-cover rounded-full border-4 border-white/20" alt="Promo">
                    </div>

                    <!-- Category Grid -->
                    <div>
                        <div class="grid grid-cols-4 gap-3 text-center">
                            <button onclick="navigateCustomerTab('search')" class="flex flex-col items-center gap-1.5 group">
                                <div class="w-12 h-12 bg-red-100 text-foodie-red rounded-2xl flex items-center justify-center group-hover:scale-105 transition">
                                    <i data-lucide="utensils" class="w-6 h-6"></i>
                                </div>
                                <span class="text-[11px] font-medium text-slate-700">Tất cả</span>
                            </button>
                            <button onclick="navigateCustomerTab('search')" class="flex flex-col items-center gap-1.5 group">
                                <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center group-hover:scale-105 transition">
                                    <i data-lucide="soup" class="w-6 h-6"></i>
                                </div>
                                <span class="text-[11px] font-medium text-slate-700">Cơm</span>
                            </button>
                            <button onclick="navigateCustomerTab('search')" class="flex flex-col items-center gap-1.5 group">
                                <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center group-hover:scale-105 transition">
                                    <i data-lucide="cooking-pot" class="w-6 h-6"></i>
                                </div>
                                <span class="text-[11px] font-medium text-slate-700">Phở / Bún</span>
                            </button>
                            <button onclick="navigateCustomerTab('search')" class="flex flex-col items-center gap-1.5 group">
                                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center group-hover:scale-105 transition">
                                    <i data-lucide="cup-soda" class="w-6 h-6"></i>
                                </div>
                                <span class="text-[11px] font-medium text-slate-700">Trà sữa</span>
                            </button>
                        </div>
                    </div>

                    <!-- Featured Section -->
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-slate-800 text-sm">Quán nổi bật</h3>
                            <button onclick="navigateCustomerTab('search')" class="text-xs text-foodie-red font-semibold">Xem tất cả</button>
                        </div>

                        <div onclick="navigateCustomerTab('restaurant')" class="bg-white rounded-2xl p-2.5 border border-slate-100 shadow-sm flex gap-3 cursor-pointer hover:border-foodie-red/30 transition">
                            <img src="https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?auto=format&fit=crop&q=80&w=200" 
                                 class="w-20 h-20 rounded-xl object-cover" alt="Bún Bò Huế">
                            <div class="flex-1 flex flex-col justify-between py-0.5">
                                <div>
                                    <h4 class="font-bold text-xs text-slate-800">Bún Bò Huế An Nam</h4>
                                    <div class="flex items-center gap-2 text-[11px] text-slate-500 mt-1">
                                        <span class="text-amber-500 font-bold flex items-center gap-0.5">⭐ 4.8</span>
                                        <span>(1.2k)</span>
                                        <span>• 20-30 phút</span>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1">
                                    <span class="bg-red-50 text-foodie-red text-[10px] font-bold px-1.5 py-0.5 rounded">Giảm 20%</span>
                                    <span class="bg-orange-50 text-orange-600 text-[10px] font-bold px-1.5 py-0.5 rounded">Freeship</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
            <!-- Customer Bottom Navigation Bar -->
            <nav class="absolute bottom-0 left-0 right-0 h-14 bg-white border-t border-slate-200 flex items-center justify-around z-20">
                <button onclick="navigateCustomerTab('home')" id="cust-nav-home" class="flex flex-col items-center gap-0.5 text-foodie-red">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    <span class="text-[9px] font-bold">Trang chủ</span>
                </button>
                <button onclick="navigateCustomerTab('tracking')" id="cust-nav-tracking" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-600">
                    <i data-lucide="clipboard-list" class="w-4 h-4"></i>
                    <span class="text-[9px] font-bold">Đơn hàng</span>
                </button>
                <button onclick="navigateCustomerTab('cart')" id="cust-nav-cart" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-600">
                    <i data-lucide="heart" class="w-4 h-4"></i>
                    <span class="text-[9px] font-bold">Yêu thích</span>
                </button>
                <button onclick="navigateCustomerTab('profile')" id="cust-nav-profile" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-600">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    <span class="text-[9px] font-bold">Tài khoản</span>
                </button>
            </nav>
        </main>
        <div id="app-toast"
    class="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs font-semibold
           px-4 py-2 rounded-full shadow-2xl z-[100] transition-all duration-300
           pointer-events-none opacity-0 translate-y-[-10px] flex items-center gap-2">
    <span id="toast-message">Thông báo</span>
</div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
